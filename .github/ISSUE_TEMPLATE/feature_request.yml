name: Feature request
description: Suggest an idea for Concerto
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion!

        Before opening a request, consider whether it touches cross-crate
        ownership, persistent formats, security boundaries, or product-wide
        invariants — those need an ADR first (see CONTRIBUTING.md), and this
        issue may become that ADR's starting point.
  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear and concise description of what the problem is.
      placeholder: I'm always frustrated when [...]
    validations:
      required: false
  - type: textarea
    id: solution
    attributes:
      label: Describe the solution you'd like
      description: What you want to happen, and which part of Concerto it affects (core, orchestrator, tools, desktop, CLI, plugins, ...).
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Describe alternatives you've considered
      description: Any alternative solutions or features you've considered.
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add any other context, mockups, or screenshots about the request here.
    validations:
      required: false
