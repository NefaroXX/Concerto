# Release artifact builder for tagged versions.
#
# Triggered by pushing a tag such as v0.4.0. Builds the `concerto` entry
# binary (default features include the desktop frontend) for the supported
# platforms, uploads per-target artifacts, then publishes a GitHub release
# with auto-generated notes once every target succeeds.
#
# Note: on Linux the desktop frontend links against system graphics
# libraries; this workflow installs what iced/wgpu need at build time.

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      # Keep building remaining targets when one platform fails so the
      # failure report shows the full picture.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            suffix: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            suffix: ".exe"
          - os: macos-latest
            target: aarch64-apple-darwin
            suffix: ""
          - os: macos-latest
            target: x86_64-apple-darwin
            suffix: ""
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain (1.96.0)
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux graphics dependencies (iced/wgpu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libx11-dev \
            libxcb1-dev libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev

      - name: Restore cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }} -p concerto

      - name: Stage binary for upload
        shell: bash
        run: |
          cp "target/${{ matrix.target }}/release/concerto${{ matrix.suffix }}" \
             "concerto-${{ github.ref_name }}-${{ matrix.target }}${{ matrix.suffix }}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: concerto-${{ matrix.target }}
          path: concerto-${{ github.ref_name }}-${{ matrix.target }}${{ matrix.suffix }}
          if-no-files-found: error

  release:
    name: Create GitHub release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish release with assets
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
