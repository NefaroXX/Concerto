# Dev artifact builder: fresh Windows/Linux smoke-test binaries without local
# builds.
#
# Triggers on every push to `dev` (docs-only changes excluded) and manually
# via workflow_dispatch. Builds the `concerto` entry binary (default features
# include the desktop frontend) in the debug profile — fast with a warm
# cache, and behavior-identical for smoke testing — then uploads it with the
# commit SHA baked into the filename, so a downloaded binary is always
# traceable to its exact commit (no more stale-binary questions: the SHA is
# the version).
#
# Download: Actions tab → "Dev builds" → latest green run → Artifacts →
# concerto-windows-dev (concerto-dev-<sha>-x86_64-pc-windows-msvc.exe) or
# concerto-linux-dev (concerto-dev-<sha>-x86_64-unknown-linux-gnu).
# Retention is deliberately short; tagged releases remain the durable
# artifacts (see release.yml).
#
# Why an explicit --target triple on both jobs: it puts the binary in a
# target-triple directory (no ambiguity with mixed-target caches) and makes
# the artifact filename self-describing without platform-specific branching.

name: Dev builds

on:
  push:
    branches:
      - dev
    paths-ignore:
      - "**.md"
      - "docs/**"
  pull_request:
    branches:
      - dev
    paths:
      - .github/workflows/dev-build.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dev-build-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build-windows-dev:
    name: Windows dev binary
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain (1.96.0)
        uses: dtolnay/rust-toolchain@1.96.0

      - name: Restore cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          key: windows-dev

      - name: Build debug binary
        run: cargo build --target x86_64-pc-windows-msvc -p concerto

      - name: Stage SHA-named binary
        shell: bash
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "SHORT_SHA=${SHORT_SHA}" >> "${GITHUB_ENV}"
          cp "target/x86_64-pc-windows-msvc/debug/concerto.exe" \
             "concerto-dev-${SHORT_SHA}-x86_64-pc-windows-msvc.exe"

      - name: Upload dev artifact
        uses: actions/upload-artifact@v4
        with:
          name: concerto-windows-dev
          path: concerto-dev-${{ env.SHORT_SHA }}-x86_64-pc-windows-msvc.exe
          if-no-files-found: error
          retention-days: 14

  build-linux-dev:
    name: Linux dev binary
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain (1.96.0)
        uses: dtolnay/rust-toolchain@1.96.0

      # Matches the apt list in ci.yml: the concerto binary with default
      # features (desktop included) compiles on hosted Ubuntu with exactly
      # these, so no X11/Wayland/GL packages are needed to build.
      - name: Install system dependencies (dbus, ssl, sqlite, pkg-config)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libdbus-1-dev pkg-config libssl-dev libsqlite3-dev

      - name: Restore cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          key: linux-dev

      - name: Build debug binary
        run: cargo build --target x86_64-unknown-linux-gnu -p concerto

      # Unlike the Windows job (headless runner, GUI app), the Linux CLI
      # subcommands run headless — prove the artifact starts before upload.
      - name: Smoke-run launcher command
        run: ./target/x86_64-unknown-linux-gnu/debug/concerto config help

      - name: Stage SHA-named binary
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "SHORT_SHA=${SHORT_SHA}" >> "${GITHUB_ENV}"
          cp "target/x86_64-unknown-linux-gnu/debug/concerto" \
             "concerto-dev-${SHORT_SHA}-x86_64-unknown-linux-gnu"

      - name: Upload dev artifact
        uses: actions/upload-artifact@v4
        with:
          name: concerto-linux-dev
          path: concerto-dev-${{ env.SHORT_SHA }}-x86_64-unknown-linux-gnu
          if-no-files-found: error
          retention-days: 14
