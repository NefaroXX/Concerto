[package]
name = "concerto-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
concerto-api-types = { path = "../api-types", version = "0.1.0" }
concerto-config = { path = "../config", version = "0.1.0" }
concerto-core = { path = "../core", version = "0.1.0" }

async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", default-features = false, features = ["signal"] }

[dev-dependencies]
serde_json = { workspace = true }
tokio = { workspace = true }

[[bin]]
name = "fixture-mcp-server"
path = "src/bin/fixture_mcp_server.rs"

[target.'cfg(windows)'.dependencies]
# Spawn suspended into a retained kill-on-close Job Object; no unsafe code in this crate.
process-wrap = { version = "10.0.1", default-features = false, features = ["tokio1", "job-object", "kill-on-drop"] }
