[package]
name = "concerto-observability"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
opentelemetry = "0.33"
opentelemetry_sdk = { version = "0.33", features = ["rt-tokio", "trace"] }
opentelemetry-otlp = { version = "0.33", features = ["http-proto", "reqwest-client"] }
# 0.7.0 is the first release targeting the opentelemetry 0.33 family; 0.6.1
# pinned ^0.31 and would reintroduce a duplicate opentelemetry major.
opentelemetry-langfuse = "0.7.0"
metrics = "0.24"
metrics-exporter-prometheus = "0.18.3"
tokio = { workspace = true }
tracing = { workspace = true }
axum = { workspace = true }
concerto-core = { path = "../core" }
concerto-config = { path = "../config" }

[dev-dependencies]
opentelemetry-stdout = "0.33"
