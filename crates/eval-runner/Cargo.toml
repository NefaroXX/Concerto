[package]
name = "concerto-eval-runner"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
concerto-core = { path = "../core", version = "0.1.0" }
concerto-eval = { path = "../eval", version = "0.1.0" }
concerto-orchestrator = { path = "../orchestrator", version = "0.1.0" }
concerto-providers = { path = "../providers", version = "0.1.0" }
concerto-config = { path = "../config", version = "0.1.0" }
concerto-tools = { path = "../tools", version = "0.1.0" }
concerto-sessions = { path = "../sessions", version = "0.1.0" }
concerto-memory = { path = "../memory", version = "0.1.0" }
dirs = { workspace = true }
camino = { workspace = true }

toml = { workspace = true }
tokio = { workspace = true, features = ["process", "time", "rt-multi-thread", "macros", "sync"] }
tokio-util = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
async-trait = "0.1"

[[bin]]
name = "cargo-eval"
path = "src/main.rs"

[dev-dependencies]
time = { workspace = true }
