[lints]
workspace = true

[dependencies]
# Internal crates
concerto-core = { path = "../core", version = "0.1.0" }
concerto-api-types = { path = "../api-types", version = "0.1.0" }


# WASM runtime
wasmtime.workspace = true

# General
serde.workspace = true
sha2 = "0.10"
serde_json.workspace = true
toml.workspace = true
tokio = { workspace = true, features = ["sync", "time", "rt-multi-thread"] }
tracing.workspace = true
thiserror.workspace = true
async-trait.workspace = true
camino.workspace = true
dirs.workspace = true
reqwest.workspace = true
anyhow = "1"
url = "2"
futures = { workspace = true }

[dev-dependencies]
concerto-tools = { path = "../tools", version = "0.1.0" }
tempfile = "3"
wat = "1"
