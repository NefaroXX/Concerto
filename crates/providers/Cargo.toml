[package]
name = "concerto-providers"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = []
# Opt-in OpenCode free-tier port.
#
# STATUS (2026-09-30): the anonymous HTTP path this feature was built for does
# NOT work. Live testing shows the Zen relay refuses `Authorization: Bearer
# public` with `403 FreeTierError` for 7 of the 8 zero-cost models and `429`
# for the rest — anonymous HTTP access to the Zen relay is refused
# server-side. The supported route to OpenCode's free models is a local
# `opencode serve` instance, exposed as the `opencode-local` provider type
# (which does not need this feature).
#
# What remains useful with the flag ON: the cost-based Zen catalog
# (`OPENCODE_FREE_KNOWN`) and `is_free_cost` classification, the free-only
# keyless picker filter, and the `FreeTierRefused` 403 error surface. The
# credential substitution to the literal `public` has been removed; a real key
# is now required.
opencode-free-tier = []

[dependencies]
concerto-core = { path = "../core", version = "0.1.0" }
concerto-config = { path = "../config", version = "0.1.0" }
concerto-sessions = { path = "../sessions", version = "0.1.0" }

tokio = { workspace = true }
tokio-util = { workspace = true }
futures = { workspace = true }
async-stream = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
tracing = { workspace = true }

reqwest = { workspace = true }
tiktoken-rs = { workspace = true }
fastrand = { workspace = true }
httpdate = "1"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports", "async_tokio"] }
# Used by provider-compat tests (audit H-01) to build the real
# submit_design_doc schema instead of a hand-maintained duplicate.
schemars = "1"

[[bench]]
name = "provider_streaming"
harness = false
