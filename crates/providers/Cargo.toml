[package]
name = "concerto-providers"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
concerto-core = { path = "../core", version = "0.1.0" }
concerto-config = { path = "../config", version = "0.1.0" }
concerto-sessions = { path = "../sessions", version = "0.1.0" }

tokio = { workspace = true }
tokio-util = { workspace = true }
futures = { workspace = true }
async-stream = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
tracing = { workspace = true }

reqwest = { workspace = true }
tiktoken-rs = { workspace = true }
fastrand = { workspace = true }
httpdate = "1"

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports", "async_tokio"] }
# Used by provider-compat tests (audit H-01) to build the real
# submit_design_doc schema instead of a hand-maintained duplicate.
schemars = "1"

[[bench]]
name = "provider_streaming"
harness = false
