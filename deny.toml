# cargo-deny config. Run with: cargo deny check
# Phase 0 requirement: license + duplicate-dependency checking in CI.
# Tighten the advisories/bans sections as real dependencies land in later
# phases — this is deliberately permissive until there's something to be
# strict about.

[graph]
targets = []

[advisories]
yanked = "deny"
# Scope::Transitive: report unsound advisories for ALL crates in the graph,
# not just direct dependencies of workspace members (cargo-deny's default is
# Scope::Workspace, which silently skips unsound advisories on transitive deps
# such as lru via ratatui and event-listener via zbus).
unsound = "transitive"
ignore = [
    "RUSTSEC-2024-0320",  # yaml-rust — unmaintained, used by syntect for syntax highlighting
    "RUSTSEC-2024-0384",  # instant — unmaintained, transitive dep via iced
    "RUSTSEC-2024-0436",  # paste — unmaintained, transitive dep
    "RUSTSEC-2025-0119",  # number_prefix — unmaintained, transitive dep
    "RUSTSEC-2025-0141",  # bincode — unmaintained, transitive dep
    # === wasmtime v28.0.1 exceptions ===
    # Reason: wasmtime pinned to v28 for plugin sandbox. Upgrading to v43+ requires
    # significant API migration (func_wrap signature changed in v32+). The plugin sandbox
    # is opt-in, not enabled by default, and plugins run with limited host capabilities.
    # All advisories are denial-of-service or sandbox-escape within WASM guests — not
    # host-level RCE. Risk is acceptable for a local-first desktop/CLI tool.
    # Scope: concerto-plugins crate only (crates/plugins/)
    # Review date: 2026-10-01 — reassess wasmtime upgrade feasibility.
    # Upstream: https://github.com/bytecodealliance/wasmtime/security/advisories
    "RUSTSEC-2025-0046",  # wasmtime fd_renumber panic — DoS in WASI guest
    "RUSTSEC-2025-0118",  # wasmtime shared linear memory unsound API — sandbox boundary
    "RUSTSEC-2026-0020",  # wasmtime guest resource exhaustion — DoS in WASI
    "RUSTSEC-2026-0021",  # wasmtime http/types.fields panic — DoS in guest
    "RUSTSEC-2026-0085",  # wasmtime flags lift panic — DoS in guest
    "RUSTSEC-2026-0086",  # wasmtime host data leakage Winch — requires Winch backend
    "RUSTSEC-2026-0087",  # wasmtime f64x2.splat crash — requires specific SIMD guest code
    "RUSTSEC-2026-0088",  # wasmtime pooling allocator leakage — data isolation issue
    "RUSTSEC-2026-0089",  # wasmtime table.fill panic Winch — requires Winch backend
    "RUSTSEC-2026-0091",  # wasmtime component string OOB — guest-side transcoding
    "RUSTSEC-2026-0092",  # wasmtime UTF-16 misalign panic — guest-side transcoding
    "RUSTSEC-2026-0093",  # wasmtime UTF-16 OOB read — guest-side transcoding
    "RUSTSEC-2026-0094",  # wasmtime table.grow mask Winch — requires Winch backend
    "RUSTSEC-2026-0095",  # wasmtime Winch sandbox escape — requires Winch backend
    "RUSTSEC-2026-0096",  # wasmtime aarch64 Cranelift miscompile — aarch64 only, local tool
    "RUSTSEC-2026-0222",  # wasmtime stores can mix type indices between engines — Low (3.8);
                          # embedder-only (needs 2 Engines, objects mixed across them), not
                          # guest-triggerable; PluginHost uses a single shared Engine
                          # (crates/plugins/src/host.rs), so usage is unaffected
    # === quick-xml exceptions ===
    # Reason: quick-xml v0.38.4/v0.39.4 constrained by plist (syntect via iced) and
    # wayland-scanner. These are XML parsing DoS vectors that require crafted XML input.
    # Risk is low for a local desktop/CLI tool that doesn't parse untrusted XML.
    # Scope: transitive deps only (syntect, wayland-scanner)
    # Review date: 2026-10-01 — check if upstream deps updated.
    "RUSTSEC-2026-0194",  # quick-xml quadratic attribute check — CPU DoS
    "RUSTSEC-2026-0195",  # quick-xml NsReader memory exhaustion — heap DoS
    # === ttf-parser unmaintained ===
    # Reason: ttf-parser v0.25.1 is unmaintained, used by fontdb/cosmic-text for font parsing.
    # No security vulnerability, just unmaintained. Replacement (skrifa) requires upstream changes.
    # Scope: transitive dep via iced font rendering
    # Review date: 2026-10-01
    "RUSTSEC-2026-0192",  # ttf-parser unmaintained — no security issue, maintenance only
    # === lru unsoundness (ratatui + iced_wgpu/cryoglyph paths) ===
    # Reason: two distinct lru advisories on two pinned transitive paths.
    # - RUSTSEC-2026-0002: lru v0.12.5 Stacked Borrows violation in IterMut,
    #   via ratatui v0.29.0 (concerto-cli TUI).
    # - RUSTSEC-2026-0253: lru < 0.18.2 unsoundness in LruCache::pop
    #   (use-after-free under panic in `pop`), via iced_wgpu -> cryoglyph
    #   (desktop glyph cache). cryoglyph pins `lru = "^0.16"`, and the fix
    #   (0.18.2) is a breaking release outside that requirement — bumping is
    #   not selectable until iced/cryoglyph upstream relax the pin.
    # Risk: memory-safety issue that requires the specific call patterns the
    # advisory describes; both consumers are single-threaded UI caches, not
    # adversarial-input paths.
    # Scope: concerto-cli (ratatui path) + concerto-desktop (cryoglyph path).
    # Note: enforced by `unsound = "transitive"` above — both advisories ARE
    # detected on their transitive paths and suppressed here.
    # Review date: 2026-10-01 — re-check ratatui 0.30+ and iced/cryoglyph
    # releases for relaxed lru pins (>=0.18.2), then drop these ignores.
    "RUSTSEC-2026-0002",  # lru — unsound IterMut, transitive via ratatui
    "RUSTSEC-2026-0253",  # lru — unsound pop, transitive via iced_wgpu -> cryoglyph (pinned ^0.16)
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Unicode-3.0",
    "ISC",
    "Zlib",
    "MPL-2.0",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "NCSA",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
# Workspace path dependencies are legitimate in a Cargo workspace.
# Only deny wildcards for external crates.io dependencies.
wildcards = "allow"
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
