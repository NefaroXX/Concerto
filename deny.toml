# cargo-deny config. Run with: cargo deny check
# Phase 0 requirement: license + duplicate-dependency checking in CI.
# Tighten the advisories/bans sections as real dependencies land in later
# phases — this is deliberately permissive until there's something to be
# strict about.

[graph]
targets = []

[advisories]
yanked = "deny"
# Scope::Transitive: report unsound advisories for ALL crates in the graph,
# not just direct dependencies of workspace members (cargo-deny's default is
# Scope::Workspace, which silently skips unsound advisories on transitive deps
# such as lru via ratatui and event-listener via zbus).
unsound = "transitive"
ignore = [
    "RUSTSEC-2024-0320",  # yaml-rust — unmaintained, used by syntect for syntax highlighting
    "RUSTSEC-2024-0384",  # instant — unmaintained, transitive dep via iced
    "RUSTSEC-2024-0436",  # paste — unmaintained, transitive dep
    "RUSTSEC-2025-0141",  # bincode — unmaintained, transitive dep
    # Wasmtime exceptions retired: the 36.0.19 LTS upgrade includes the fixes.
    # === quick-xml exceptions ===
    # Reason: quick-xml v0.38.4/v0.39.4 constrained by plist (syntect via iced) and
    # wayland-scanner. These are XML parsing DoS vectors that require crafted XML input.
    # Risk is low for a local desktop/CLI tool that doesn't parse untrusted XML.
    # Scope: transitive deps only (syntect, wayland-scanner)
    # Review date: 2026-10-01 — check if upstream deps updated.
    "RUSTSEC-2026-0194",  # quick-xml quadratic attribute check — CPU DoS
    "RUSTSEC-2026-0195",  # quick-xml NsReader memory exhaustion — heap DoS
    # === ttf-parser unmaintained ===
    # Reason: ttf-parser v0.25.1 is unmaintained, used by fontdb/cosmic-text for font parsing.
    # No security vulnerability, just unmaintained. Replacement (skrifa) requires upstream changes.
    # Scope: transitive dep via iced font rendering
    # Review date: 2026-10-01
    "RUSTSEC-2026-0192",  # ttf-parser unmaintained — no security issue, maintenance only
    # === lru unsoundness (iced_wgpu/cryoglyph path) ===
    # Reason: one lru advisory on one pinned transitive path.
    # - RUSTSEC-2026-0253: lru < 0.18.2 unsoundness in LruCache::pop
    #   (use-after-free under panic in `pop`), via iced_wgpu -> cryoglyph
    #   (desktop glyph cache), which resolves lru 0.16.4. cryoglyph pins
    #   `lru = "^0.16"`, and the fix (0.18.2) is a breaking release outside
    #   that requirement — bumping is not selectable until iced/cryoglyph
    #   upstream relax the pin.
    # Risk: memory-safety issue that requires the specific call patterns the
    # advisory describes; the consumer is a single-threaded UI cache, not an
    # adversarial-input path.
    # Scope: concerto-desktop (cryoglyph path) only.
    # Note: enforced by `unsound = "transitive"` above — this advisory IS
    # detected on its transitive path and suppressed here.
    # RETIRED 2026-10-14 — RUSTSEC-2026-0002 (unsound `IterMut`, Stacked
    # Borrows violation) was removed from this list because it no longer
    # matches any crate: the ratatui 0.29.0 -> 0.30.2 bump moved concerto-cli's
    # lru off the vulnerable 0.12.5 and onto 0.18.5, which is past the fix.
    # Leaving the entry would have reintroduced the dormant-suppression class
    # removed in #345 (a stale ignore that silently stops firing).
    # Review date: 2026-10-14 — re-check iced/cryoglyph releases for a relaxed
    # lru pin (>=0.18.2), then drop this ignore and close the last lru entry.
    "RUSTSEC-2026-0253",  # lru — unsound pop, transitive via iced_wgpu -> cryoglyph (pinned ^0.16)
    # === zbus family unmaintained (merged upstream into zbus 6.0.0) ===
    # Reason: RUSTSEC-2026-0370 (zvariant), RUSTSEC-2026-0371 (zbus_names) and
    # RUSTSEC-2026-0372 (zvariant_derive), all published 2026-10-16, are
    # maintenance-only notices: the three standalone crates were absorbed into
    # zbus 6.0.0 (wire format, `names` module, and derive macros respectively).
    # No vulnerability in any of them; the advisories fire because the
    # standalone crates will see no further releases.
    # The workspace currently resolves zbus 5.16.0 with the standalone crates
    # as its transitives, pulled in exclusively behind the keyring stack
    # (keyring -> D-Bus Secret Service backend on Linux). Migrating the stack
    # to zbus 6.0.0 is an upstream keyring collaboration, not a selectable
    # bump from this workspace — suppressing is the correct interim measure
    # until that upgrade lands; any zbus/keyring bump re-fires `cargo deny
    # check` here if these crates resurface, forcing re-review.
    # Scope: transitive deps only (keyring D-Bus backend).
    # Review date: 2026-10-17 — revisit when keyring or zbus versions move.
    "RUSTSEC-2026-0370",  # zvariant unmaintained — merged into zbus 6.0.0 (wire module)
    "RUSTSEC-2026-0371",  # zbus_names unmaintained — merged into zbus 6.0.0 (names module)
    "RUSTSEC-2026-0372",  # zvariant_derive unmaintained — derives now provided by zbus 6.0.0
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Unicode-3.0",
    "ISC",
    "Zlib",
    "MPL-2.0",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "NCSA",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
# Workspace path dependencies are legitimate in a Cargo workspace.
# Only deny wildcards for external crates.io dependencies.
wildcards = "allow"
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
